
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12b8b0">
<meta name="description" content="Modd - Connect, Share and Enjoy">
<title>Modd Social App</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3fbfa;font-family:Arial,sans-serif;color:#183b3a}
header{background:#12b8b0;color:white;padding:17px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:bold}
header span{font-size:13px}
main{max-width:600px;margin:auto;padding:16px}
.card{background:white;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #0000000c}
h2{margin:0 0 12px;color:#119e98}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #d5e7e5;border-radius:10px;font-size:15px}
textarea{resize:vertical;min-height:75px}
button{border:0;background:#12b8b0;color:white;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#e5f7f5;color:#118f89}
button:disabled{opacity:.6}
.tabs{display:flex;gap:8px;margin:15px 0}
.tabs button{flex:1}
.post{border-top:1px solid #edf3f2;padding-top:15px;margin-top:15px}
.post-name{font-weight:bold;color:#118f89}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:#78918f;font-size:13px}
.hidden{display:none}
#message{color:#d34b4b;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.actions button{padding:9px 13px}
.comment{background:#f3fbfa;border-radius:10px;padding:9px;margin:7px 0;font-size:14px}
.comment-form{display:flex;gap:7px;align-items:center;margin-top:10px}
.comment-form input{margin:0;min-width:0}
.comment-form button{white-space:nowrap;padding:11px}
.post-media{width:100%;max-height:350px;object-fit:contain;border-radius:12px;margin-top:10px;background:#f3fbfa}
footer{text-align:center;color:#78918f;padding:25px;font-size:13px}
</style>
</head>

<body>
<header>
 <div class="logo">Modd.</div>
 <span>Connect • Share • Enjoy</span>
</header>

<main>
 <section class="card" id="auth">
  <h2>Welcome to Modd</h2>
  <p class="muted">अपने दोस्तों से जुड़ें और अपनी दुनिया शेयर करें।</p>

  <div class="tabs">
   <button id="loginTab" onclick="showLogin()">Login</button>
   <button class="secondary" id="signupTab" onclick="showSignup()">Sign Up</button>
  </div>

  <form id="authForm">
   <input id="name" placeholder="आपका नाम" class="hidden">
   <input id="email" type="email" placeholder="Email address" required>
   <input id="password" type="password" placeholder="Password" required>
   <button type="submit" id="submitBtn">Login</button>
  </form>
  <p id="message"></p>
 </section>

 <section id="home" class="hidden">
  <div class="card">
   <h2>आपका Modd Feed</h2>
   <p id="welcomeText">Modd पर आपका स्वागत है।</p>
   <textarea id="postText" placeholder="आपके मन में क्या है?"></textarea>
   <button onclick="createPost()">Post Share करें</button>
   <button class="secondary" onclick="logout()">Logout</button>
  </div>

  <div class="card">
   <h2>Latest Posts</h2>
   <div id="feed"><p class="muted">Posts लोड हो रही हैं...</p></div>
  </div>
 </section>
</main>

<footer>© 2026 Modd Social App</footer>

<script>
const API = "https://modd-social-app.onrender.com/api";

let mode = "login";
let token = localStorage.getItem("modd_token") || "";
let currentUser = null;

try {
 currentUser = JSON.parse(localStorage.getItem("modd_user") || "null");
} catch(e) {
 currentUser = null;
}

function safe(value) {
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function showLogin() {
 mode = "login";
 document.getElementById("name").classList.add("hidden");
 document.getElementById("submitBtn").textContent = "Login";
 document.getElementById("loginTab").className = "";
 document.getElementById("signupTab").className = "secondary";
}

function showSignup() {
 mode = "signup";
 document.getElementById("name").classList.remove("hidden");
 document.getElementById("submitBtn").textContent = "Create Account";
 document.getElementById("signupTab").className = "";
 document.getElementById("loginTab").className = "secondary";
}

document.getElementById("authForm").addEventListener("submit", async e => {
 e.preventDefault();

 const message = document.getElementById("message");
 const submit = document.getElementById("submitBtn");
 submit.disabled = true;
 message.textContent = "कृपया प्रतीक्षा करें...";

 const data = {
  email: document.getElementById("email").value.trim(),
  password: document.getElementById("password").value
 };

 if(mode === "signup") {
  data.name = document.getElementById("name").value.trim();
 }

 try {
  const response = await fetch(API + "/auth/" + mode, {
   method: "POST",
   headers: {"Content-Type":"application/json"},
   body: JSON.stringify(data)
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Login failed");

  token = result.token;
  currentUser = result.user || null;

  localStorage.setItem("modd_token", token);
  if(currentUser) {
   localStorage.setItem("modd_user", JSON.stringify(currentUser));
  }

  await openHome();

 } catch(error) {
  message.textContent = error.message;
 } finally {
  submit.disabled = false;
 }
});

async function loadCurrentUser() {
 if(!token) return;

 try {
  const response = await fetch(API + "/users/me", {
   headers: {"Authorization":"Bearer " + token}
  });

  const result = await response.json();
  if(response.ok) {
   currentUser = result.user || result;
   localStorage.setItem("modd_user", JSON.stringify(currentUser));
  }
 } catch(error) {
  console.log("Profile loading error", error);
 }
}

async function openHome() {
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");

 await loadCurrentUser();

 const name = currentUser?.name || "दोस्त";
 document.getElementById("welcomeText").textContent =
  "नमस्ते " + name + "! Modd पर आपका स्वागत है।";

 await loadFeed();
}

async function loadFeed() {
 const feed = document.getElementById("feed");
 feed.innerHTML = "<p class='muted'>Posts लोड हो रही हैं...</p>";

 try {
  const response = await fetch(API + "/posts", {
   headers: {"Authorization":"Bearer " + token}
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Feed load failed");

  const posts = result.posts || [];

  if(posts.length === 0) {
   feed.innerHTML = "<p class='muted'>अभी कोई पोस्ट नहीं है।</p>";
   return;
  }

  feed.innerHTML = posts.map(p => {
   const author = p.author?.name || p.author?.username || "Modd User";
   const likes = Array.isArray(p.likes) ? p.likes : [];
   const comments = Array.isArray(p.comments) ? p.comments : [];

   const myId = currentUser?.id || currentUser?._id;
   const liked = myId && likes.some(item =>
    String(item?._id || item) === String(myId)
   );

   const mediaHTML = (p.media || []).map(m => {
    if(m.type === "video") {
     return `<video class="post-media" controls src="${safe(m.url)}"></video>`;
    }
    return `<img class="post-media" src="${safe(m.url)}" alt="Post image">`;
   }).join("");

   const commentsHTML = comments.map(c => `
    <div class="comment">
     <b>${safe(c.user?.name || c.user?.username || "User")}</b>
     <div>${safe(c.text)}</div>
    </div>
   `).join("");

   return `
    <div class="post">
     <div class="post-name">${safe(author)}</div>
     <p class="post-text">${safe(p.text || "")}</p>
     ${mediaHTML}
     <div class="actions">
      <button class="${liked ? "" : "secondary"}"
       onclick="likePost('${safe(p._id)}', this)">
       ${liked ? "❤️ Liked" : "🤍 Like"} (${likes.length})
      </button>
      <span class="muted">${comments.length} Comments</span>
     </div>
     <div>${commentsHTML}</div>
     <form class="comment-form" onsubmit="commentPost(event,'${safe(p._id)}')">
      <input name="comment" placeholder="Comment लिखें..." maxlength="1000" required>
      <button type="submit">Send</button>
     </form>
    </div>
   `;
  }).join("");

 } catch(error) {
  feed.innerHTML = `<p class="muted">${safe(error.message)}</p>`;
 }
}

async function likePost(postId, button) {
 button.disabled = true;

 try {
  const response = await fetch(API + "/posts/" + postId + "/like", {
   method: "POST",
   headers: {"Authorization":"Bearer " + token}
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Like failed");

  await loadFeed();

 } catch(error) {
  alert(error.message);
  button.disabled = false;
 }
}

async function commentPost(event, postId) {
 event.preventDefault();

 const form = event.target;
 const input = form.elements.comment;
 const text = input.value.trim();

 if(!text) return;

 const button = form.querySelector("button");
 button.disabled = true;

 try {
  const response = await fetch(API + "/posts/" + postId + "/comments", {
   method: "POST",
   headers: {
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
   },
   body: JSON.stringify({text})
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Comment failed");

  await loadFeed();

 } catch(error) {
  alert(error.message);
  button.disabled = false;
 }
}

async function createPost() {
 const input = document.getElementById("postText");
 const text = input.value.trim();

 if(!text) {
  alert("पहले कुछ लिखिए");
  return;
 }

 try {
  const response = await fetch(API + "/posts", {
   method: "POST",
   headers: {
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
   },
   body: JSON.stringify({text})
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Post failed");

  input.value = "";
  await loadFeed();
  alert("आपकी पोस्ट शेयर हो गई!");

 } catch(error) {
  alert(error.message);
 }
}

function logout() {
 localStorage.removeItem("modd_token");
 localStorage.removeItem("modd_user");
 token = "";
 currentUser = null;
 location.reload();
}

if(token) {
 openHome();
}

if("serviceWorker" in navigator) {
 window.addEventListener("load", () => {
  navigator.serviceWorker.register("./sw.js")
   .catch(error => console.log("Service Worker Error:", error));
 });
}
</script>
</body>
 </html>
